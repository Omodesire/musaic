<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Soundscroll</title>
</head>
<body>
    <form id="search" action="submit">
        <input id="searchInput" type="text" name="username" placeholder="Search for any music, e.g. Yesterday by The Beatles">
        <button id="searchButton" value="submit" type="submit">Search</button>
    </form>
    <div id="border"></div>
    <div id="result"></div>
    <div id="videoContainer"></div>
    <div id="playerCard">
        <button id="playButton" type="button" aria-label="Play preview">▶</button>
        <div id="playerInfo">
            <div id="progressTrack"><div id="progressFill"></div></div>
            <div id="timeDisplay">0:00 / 0:00</div>
        </div>
        <audio id="player"></audio>
    </div>
    <p id="previewNote"></p>

    <div id="lyricsModal" class="modal-overlay" hidden>
        <div class="modal-box">
            <div class="modal-header">
                <span>Lyrics</span>
                <button id="closeLyricsModal" type="button" aria-label="Close lyrics">✕</button>
            </div>
            <a id="lyricsExternalLink" class="lyrics-link" href="#" target="_blank" rel="noopener noreferrer">Open on Genius</a>
            <div class="modal-frame">
                <iframe id="lyricsFrame" src="" title="Lyrics on Genius"></iframe>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
